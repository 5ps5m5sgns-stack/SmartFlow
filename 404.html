<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable · SmartFlow</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.png" type="image/png" />
  <meta name="theme-color" content="#102B1C" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg-main:#102B1C;--accent:#13C99A;--accent2:#4DB888;--text-muted:#A8C8B8}
    body{background:var(--bg-main);color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;position:relative}
    body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 30%,rgba(19,201,154,.12) 0%,transparent 65%);pointer-events:none}
    .wrap{position:relative;z-index:1;max-width:560px}
    .light{width:88px;height:200px;margin:0 auto 32px;background:#0C2015;border:1px solid rgba(19,201,154,.25);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;box-shadow:0 12px 48px rgba(0,0,0,.5)}
    .bulb{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.06)}
    .bulb.red{background:#ff5050;box-shadow:0 0 22px rgba(255,80,80,.8);animation:blink 1.6s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
    h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(56px,12vw,110px);font-weight:800;line-height:1;color:var(--accent);letter-spacing:-.03em;margin-bottom:10px}
    .sub{font-family:'Space Grotesk',sans-serif;font-size:clamp(18px,3vw,26px);font-weight:700;margin-bottom:14px}
    p{color:var(--text-muted);font-size:15px;line-height:1.7;margin-bottom:36px}
    .btn{display:inline-block;background:var(--accent);color:#0C2015;font-weight:700;font-size:15px;padding:14px 32px;border-radius:999px;text-decoration:none;transition:transform .25s,box-shadow .25s;box-shadow:0 4px 20px rgba(0,0,0,.35)}
    .btn:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.45),0 4px 16px rgba(19,201,154,.25)}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
    @media(prefers-reduced-motion:reduce){.bulb.red{animation:none}}

    /* ── Polish global : sélection, transitions de page ── */
    ::selection{background:rgba(19,201,154,.28);color:#fff}
    h1,h2,h3{text-wrap:balance}
    @view-transition{navigation:auto}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="light" aria-hidden="true">
      <div class="bulb red"></div>
      <div class="bulb"></div>
      <div class="bulb"></div>
    </div>
    <h1>404</h1>
    <p class="sub">Feu rouge : cette page n'existe pas.</p>
    <p>L'adresse demandée est introuvable — elle a peut-être été déplacée. Repassez au vert en retournant à l'accueil.</p>
    <a class="btn" href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
